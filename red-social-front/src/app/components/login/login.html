<div class="window-container">
  <div class="window">
    <div class="title-bar">
      <div class="title-bar-text">Ingreso al Sistema</div>
      <div class="title-bar-controls">
        <button aria-label="Close">x</button>
      </div>
    </div>
    <div class="window-body">
      <p>Por favor, ingrese sus credenciales:</p>
      
      <form>
        <div class="field-row">
          <label for="username">Usuario:</label>
          <!-- Agregado el name y el ngModel -->
          <input id="username" type="text" name="correoOrUsername" [(ngModel)]="credenciales.correoOrUsername" placeholder="ej: mateocquil" />
        </div>
        <div class="field-row">
          <label for="password">Contraseña:</label>
          <!-- Agregado el name y el ngModel -->
          <input id="password" type="password" name="password" [(ngModel)]="credenciales.password" />
        </div>
        
        <div class="actions">
          <!-- Conectados a las funciones de tu TypeScript -->
          <button type="button" (click)="irAlRegistro()">Registrarse</button>
          <button type="button" (click)="ingresar()">Ingresar</button>
        </div>
      </form>

    </div>
  </div>
</div>
