<div class="window-container">
  <div class="window main-window">
    <div class="title-bar">
      <div class="title-bar-text">Muro de Publicaciones - Red Social Y2K</div>
      <div class="title-bar-controls">
        <button (click)="cerrarSesion()" title="Cerrar Sesión">X</button>
      </div>
    </div>
    <div class="window-body">
      
      <!-- Formulario para crear post -->
      <div class="sub-window">
        <h3>Nueva Publicación</h3>
        <form (ngSubmit)="publicar()">
          <div class="field-row">
            <label>Título:</label>
            <input type="text" [(ngModel)]="nuevaPublicacion.titulo" name="titulo" required />
          </div>
          <div class="field-row">
            <label>Contenido:</label>
            <input type="text" [(ngModel)]="nuevaPublicacion.descripcion" name="descripcion" required />
          </div>
          <div class="field-row">
            <label>Imagen:</label>
            <input type="file" (change)="onFileSelected($event)" accept="image/*" />
          </div>
          <div class="actions">
            <button type="submit">Publicar</button>
          </div>
        </form>
      </div>

      <hr />

      <div *ngFor="let post of publicaciones" class="post-card">
  <h4>{{ post.titulo }}</h4>
  <p>{{ post.descripcion }}</p>

  <img *ngIf="post.urlImagen" [src]="post.urlImagen" alt="Imagen de la publicación" class="post-img" />

  <small>Autor: {{ post.autor?.username || 'Anónimo' }}</small>
</div>

      <!-- Listado del Muro -->
      <h3>Feed</h3>
      <div class="posts-container">
        <div *ngFor="let post of publicaciones" class="post-card">
          <h4>{{ post.titulo }}</h4>
          <p>{{ post.descripcion }}</p>
          
          <small>Autor: {{ post.autor?.username || 'Anónimo' }}</small>
        </div>
      </div>

    </div>
  </div>
</div>
